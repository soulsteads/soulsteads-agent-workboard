[package]
name = "soulsteads-agent-workboard"
version = "0.1.0"
edition = "2024"
description = "Durable issue coordination for autonomous agents, via JSON CLI and MCP"
license = "Apache-2.0"

[lib]
name = "agent_workboard"

[[bin]]
name = "workboard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
