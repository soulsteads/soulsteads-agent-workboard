[package]
name = "soulsteads-agent-workboard"
version = "0.1.0"
edition = "2024"
description = "Durable issue coordination for autonomous agents, via JSON CLI and MCP"
license = "Apache-2.0"

[lib]
name = "agent_workboard"

[[bin]]
name = "workboard"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hmac = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
ureq = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["io-util"] }
