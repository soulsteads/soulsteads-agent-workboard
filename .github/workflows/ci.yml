name: validate
on: [push, pull_request]
jobs:
  rust-mcp-and-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      WORKBOARD_LINUX_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set runner-local Cargo target directory
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/workboard-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: scripts/package_linux_candidate.sh "${{ runner.temp }}/workboard-candidate"
      - run: uv run --locked scripts/validate_mcp.py "${{ runner.temp }}/workboard-target/x86_64-unknown-linux-gnu/release/workboard"
      - run: uv run --locked scripts/validate_web.py "${{ runner.temp }}/workboard-target/x86_64-unknown-linux-gnu/release/workboard" --install-browser --with-deps --screenshots artifacts/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-qa
          path: artifacts/web
          if-no-files-found: ignore
